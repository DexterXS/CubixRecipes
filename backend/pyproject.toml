[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cubixrecipes-backend"
version = "0.1.0"
description = "FastAPI backend for Minecraft recipe parsing and resource resolution"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "pydantic>=2.8,<3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "httpx>=0.27,<1.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
