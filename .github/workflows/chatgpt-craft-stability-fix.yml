name: ChatGPT craft stability fix

on:
  push:
    branches:
      - chatgpt/fix-craft-crash-cursor
    paths:
      - '.github/workflows/chatgpt-craft-stability-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-craft-crash-cursor
          fetch-depth: 0
      - name: Apply focused fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('frontend/src/main.tsx')
          s = p.read_text()
          old = """      <App
        authUser={authUser}
        onLogout={onLogout}
        onResetServer={handleResetServer}
        activeServerId={selectedServer}
      />"""
          new = """      {!cubixCraftOpen ? (
        <App
          authUser={authUser}
          onLogout={onLogout}
          onResetServer={handleResetServer}
          activeServerId={selectedServer}
        />
      ) : null}"""
          if old not in s:
              raise SystemExit('main App block not found')
          s = s.replace(old, new, 1)
          s = s.replace("import { VersionReloadBanner } from './components/VersionReloadBanner';", "import { VersionReloadBanner } from './components/VersionReloadBanner';\nimport { AppErrorBoundary } from './components/AppErrorBoundary';", 1)
          old_root = """  <React.StrictMode>
    <AuthGate>
      {(user, onLogout) => <ServerGate authUser={user} onLogout={onLogout} />}
    </AuthGate>
  </React.StrictMode>"""
          new_root = """  <React.StrictMode>
    <AppErrorBoundary>
      <AuthGate>
        {(user, onLogout) => <ServerGate authUser={user} onLogout={onLogout} />}
      </AuthGate>
    </AppErrorBoundary>
  </React.StrictMode>"""
          if old_root not in s:
              raise SystemExit('root block not found')
          p.write_text(s.replace(old_root, new_root, 1))

          p = Path('frontend/src/styles/cubixcraft.css')
          s = p.read_text().replace(""".cubixcraft-embedded > .app-shell > div:first-child {
  display: none !important;
}

""", '')
          p.write_text(s)

          p = Path('frontend/src/features/cubixcraft/CubixCraftWorkspace.tsx')
          s = p.read_text()
          s = s.replace("import { type CSSProperties, type ChangeEvent, useEffect, useMemo, useState } from 'react';", "import { type CSSProperties, type ChangeEvent, useEffect, useMemo, useState } from 'react';\nimport { createPortal } from 'react-dom';", 1)
          old_effect = """  useEffect(() => {
    if (!heldRaw) return;
    const handleMove = (event: MouseEvent) => setCursorPos({ x: event.clientX, y: event.clientY });
    window.addEventListener('mousemove', handleMove);
    return () => window.removeEventListener('mousemove', handleMove);
  }, [heldRaw]);"""
          new_effect = """  useEffect(() => {
    if (!heldRaw) return undefined;
    const handleMove = (event: PointerEvent) => setCursorPos({ x: event.clientX, y: event.clientY });
    window.addEventListener('pointermove', handleMove, { passive: true });
    return () => window.removeEventListener('pointermove', handleMove);
  }, [heldRaw]);"""
          if old_effect not in s:
              raise SystemExit('cursor effect not found')
          s = s.replace(old_effect, new_effect, 1)
          s = s.replace("setHeldRaw((current) => current ? null : item.raw);", "setHeldRaw((current) => current === item.raw ? null : item.raw);", 1)
          old_overlay = """      {heldRaw ? (
        <div style={{ position: 'fixed', left: cursorPos.x + 12, top: cursorPos.y + 12, width: heldSurface.cell, height: heldSurface.cell, zIndex: 10000, pointerEvents: 'none', display: 'grid', placeItems: 'center' }}>
          <div style={{ position: 'relative', width: '100%', height: '100%', display: 'grid', placeItems: 'center' }}>{itemVisual(heldRaw, heldSurface)}</div>
        </div>
      ) : null}"""
          new_overlay = """      {heldRaw ? createPortal(
        <div style={{ position: 'fixed', left: 0, top: 0, transform: `translate3d(${cursorPos.x + 12}px, ${cursorPos.y + 12}px, 0)`, width: heldSurface.cell, height: heldSurface.cell, zIndex: 10000, pointerEvents: 'none', display: 'grid', placeItems: 'center', willChange: 'transform' }}>
          <div style={{ position: 'relative', width: '100%', height: '100%', display: 'grid', placeItems: 'center' }}>{itemVisual(heldRaw, heldSurface)}</div>
        </div>,
        document.body
      ) : null}"""
          if old_overlay not in s:
              raise SystemExit('held overlay not found')
          p.write_text(s.replace(old_overlay, new_overlay, 1))

          p = Path('frontend/src/pages/App.tsx')
          s = p.read_text().replace('const workerCount = Math.min(12, queue.length);', 'const workerCount = Math.min(4, queue.length);', 1)
          p.write_text(s)

          Path('frontend/src/components/AppErrorBoundary.tsx').write_text("""import { Component, type ErrorInfo, type ReactNode } from 'react';
import { logFrontendEvent } from '../services/debugLog';

type Props = { children: ReactNode };
type State = { error: Error | null };

export class AppErrorBoundary extends Component<Props, State> {
  state: State = { error: null };

  static getDerivedStateFromError(error: Error): State { return { error }; }

  componentDidCatch(error: Error, info: ErrorInfo) {
    logFrontendEvent({ level: 'ERROR', category: 'FRONTEND_CRASH', message: 'React render crashed', details: { message: error.message, stack: error.stack ?? '', componentStack: info.componentStack ?? '' } });
  }

  render() {
    if (!this.state.error) return this.props.children;
    return (
      <main style={{ minHeight: '100vh', display: 'grid', placeItems: 'center', padding: 24, background: '#0b1220', color: '#e5eefc', fontFamily: 'Inter, Arial, sans-serif' }}>
        <section style={{ width: 'min(680px, 100%)', padding: 22, border: '1px solid #2f3b53', borderRadius: 12, background: '#121c2d' }}>
          <h1 style={{ marginTop: 0 }}>CubixRecipes: ошибка интерфейса</h1>
          <p>Страница не будет оставаться чёрной. Ошибка отправлена в журнал.</p>
          <code style={{ display: 'block', overflowWrap: 'anywhere', marginBottom: 16 }}>{this.state.error.message}</code>
          <button type="button" onClick={() => window.location.reload()}>Перезагрузить</button>
        </section>
      </main>
    );
  }
}
""")
          PY
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Commit fix
        shell: bash
        run: |
          git rm .github/workflows/chatgpt-craft-stability-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src
          git commit -m "Fix craft workspace crash and held cursor [skip ci]"
          git push origin HEAD:chatgpt/fix-craft-crash-cursor
