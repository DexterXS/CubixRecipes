name: ChatGPT craft stability fix

on:
  push:
    paths:
      - '.github/workflows/chatgpt-craft-stability-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-craft-crash-cursor
          fetch-depth: 0
      - name: Apply focused fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1. Do not keep the heavy main App mounted behind CubixCraft.
          p = Path('frontend/src/main.tsx')
          s = p.read_text()
          old = '''      <App
        authUser={authUser}
        onLogout={onLogout}
        onResetServer={handleResetServer}
        activeServerId={selectedServer}
      />'''
          new = '''      {!cubixCraftOpen ? (
        <App
          authUser={authUser}
          onLogout={onLogout}
          onResetServer={handleResetServer}
          activeServerId={selectedServer}
        />
      ) : null}'''
          if old not in s:
              raise SystemExit('main App block not found')
          s = s.replace(old, new, 1)
          if "import { AppErrorBoundary } from './components/AppErrorBoundary';" not in s:
              s = s.replace("import { VersionReloadBanner } from './components/VersionReloadBanner';", "import { VersionReloadBanner } from './components/VersionReloadBanner';\nimport { AppErrorBoundary } from './components/AppErrorBoundary';")
          old_root = '''  <React.StrictMode>
    <AuthGate>
      {(user, onLogout) => <ServerGate authUser={user} onLogout={onLogout} />}
    </AuthGate>
  </React.StrictMode>'''
          new_root = '''  <React.StrictMode>
    <AppErrorBoundary>
      <AuthGate>
        {(user, onLogout) => <ServerGate authUser={user} onLogout={onLogout} />}
      </AuthGate>
    </AppErrorBoundary>
  </React.StrictMode>'''
          if old_root not in s:
              raise SystemExit('root render block not found')
          p.write_text(s.replace(old_root, new_root, 1))

          # 2. CubixCraft has its own header when the main App is not mounted.
          p = Path('frontend/src/styles/cubixcraft.css')
          s = p.read_text()
          s = s.replace('''.cubixcraft-embedded > .app-shell > div:first-child {
  display: none !important;
}

''', '')
          p.write_text(s)

          # 3. Make the held item a real viewport cursor overlay.
          p = Path('frontend/src/features/cubixcraft/CubixCraftWorkspace.tsx')
          s = p.read_text()
          if "import { createPortal } from 'react-dom';" not in s:
              s = s.replace("import { type CSSProperties, type ChangeEvent, useEffect, useMemo, useState } from 'react';", "import { type CSSProperties, type ChangeEvent, useEffect, useMemo, useState } from 'react';\nimport { createPortal } from 'react-dom';")
          old_effect = '''  useEffect(() => {
    if (!heldRaw) return;
    const handleMove = (event: MouseEvent) => setCursorPos({ x: event.clientX, y: event.clientY });
    window.addEventListener('mousemove', handleMove);
    return () => window.removeEventListener('mousemove', handleMove);
  }, [heldRaw]);'''
          new_effect = '''  useEffect(() => {
    if (!heldRaw) return undefined;
    const handleMove = (event: PointerEvent) => setCursorPos({ x: event.clientX, y: event.clientY });
    window.addEventListener('pointermove', handleMove, { passive: true });
    return () => window.removeEventListener('pointermove', handleMove);
  }, [heldRaw]);'''
          if old_effect not in s:
              raise SystemExit('CubixCraft cursor effect not found')
          s = s.replace(old_effect, new_effect, 1)
          s = s.replace("setHeldRaw((current) => current ? null : item.raw);", "setHeldRaw((current) => current === item.raw ? null : item.raw);", 1)
          old_overlay = '''      {heldRaw ? (
        <div style={{ position: 'fixed', left: cursorPos.x + 12, top: cursorPos.y + 12, width: heldSurface.cell, height: heldSurface.cell, zIndex: 10000, pointerEvents: 'none', display: 'grid', placeItems: 'center' }}>
          <div style={{ position: 'relative', width: '100%', height: '100%', display: 'grid', placeItems: 'center' }}>{itemVisual(heldRaw, heldSurface)}</div>
        </div>
      ) : null}'''
          new_overlay = '''      {heldRaw ? createPortal(
        <div style={{ position: 'fixed', left: 0, top: 0, transform: `translate3d(${cursorPos.x + 12}px, ${cursorPos.y + 12}px, 0)`, width: heldSurface.cell, height: heldSurface.cell, zIndex: 10000, pointerEvents: 'none', display: 'grid', placeItems: 'center', willChange: 'transform' }}>
          <div style={{ position: 'relative', width: '100%', height: '100%', display: 'grid', placeItems: 'center' }}>{itemVisual(heldRaw, heldSurface)}</div>
        </div>,
        document.body
      ) : null}'''
          if old_overlay not in s:
              raise SystemExit('CubixCraft held overlay not found')
          p.write_text(s.replace(old_overlay, new_overlay, 1))

          # 4. Avoid crushing the backend with a 12-request icon resolver burst.
          p = Path('frontend/src/pages/App.tsx')
          s = p.read_text()
          if 'const workerCount = Math.min(12, queue.length);' in s:
              s = s.replace('const workerCount = Math.min(12, queue.length);', 'const workerCount = Math.min(4, queue.length);', 1)
          p.write_text(s)

          # 5. Never leave the user on a completely black screen after a React render crash.
          Path('frontend/src/components/AppErrorBoundary.tsx').write_text('''import { Component, type ErrorInfo, type ReactNode } from 'react';\nimport { logFrontendEvent } from '../services/debugLog';\n\ntype Props = { children: ReactNode };\ntype State = { error: Error | null };\n\nexport class AppErrorBoundary extends Component<Props, State> {\n  state: State = { error: null };\n\n  static getDerivedStateFromError(error: Error): State {\n    return { error };\n  }\n\n  componentDidCatch(error: Error, info: ErrorInfo) {\n    logFrontendEvent({\n      level: 'ERROR',\n      category: 'FRONTEND_CRASH',\n      message: 'React render crashed',\n      details: { message: error.message, stack: error.stack ?? '', componentStack: info.componentStack ?? '' }\n    });\n  }\n\n  render() {\n    if (!this.state.error) return this.props.children;\n    return (\n      <main style={{ minHeight: '100vh', display: 'grid', placeItems: 'center', padding: 24, background: '#0b1220', color: '#e5eefc', fontFamily: 'Inter, Arial, sans-serif' }}>\n        <section style={{ width: 'min(680px, 100%)', padding: 22, border: '1px solid #2f3b53', borderRadius: 12, background: '#121c2d' }}>\n          <h1 style={{ marginTop: 0 }}>CubixRecipes: ошибка интерфейса</h1>\n          <p>Страница не будет оставаться чёрной. Ошибка отправлена в журнал.</p>\n          <code style={{ display: 'block', overflowWrap: 'anywhere', marginBottom: 16 }}>{this.state.error.message}</code>\n          <button type="button" onClick={() => window.location.reload()}>Перезагрузить</button>\n        </section>\n      </main>\n    );\n  }\n}\n''')
          PY
      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Commit fix and remove temporary workflow
        run: |
          git rm .github/workflows/chatgpt-craft-stability-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx frontend/src/styles/cubixcraft.css frontend/src/features/cubixcraft/CubixCraftWorkspace.tsx frontend/src/pages/App.tsx frontend/src/components/AppErrorBoundary.tsx
          git commit -m "Fix craft workspace crash and held cursor"
          git push origin HEAD:chatgpt/fix-craft-crash-cursor
